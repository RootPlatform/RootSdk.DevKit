syntax = "proto3";
package moderation;

import "rootsdk/types.proto";

// ============================================================================
// ModerationService
//
// Public RPCs (any authenticated client):
//   GetDashboard      — 24h activity summary + recent events. Read-only.
//   GetAnalytics      — totals + per-day/per-rule/per-channel breakdown.
//   GetAmIAdmin       — lightweight admin-flag refresh on AdminsChanged.
//
// Admin-only RPCs (caller must be community owner OR in
// globalSettings.general.admins; server enforces via requireAdmin and throws
// ModerationError.NOT_ADMIN otherwise):
//   GetSettings              — full snapshot for the Settings page.
//   UpdateContentFilter      — toggle filter + categories + warning.
//   UpdateSpamControl        — threshold, window, scope, warning.
//   UpdateRateLimit          — enable + max + window.
//   UpdateGeneral            — analytics retention days.
//   UpdateMonitoredChannels  — full replace of monitored channel set.
//   ListWords                — paginated word list (custom or allowed).
//   AddWord / SetWordEnabled / RemoveWord — custom + allowed word mutations.
//   ListAuditLog             — paginated audit log with filters.
//   DeleteMessageManual      — manual deletion (records audit entry).
//   KickMember               — removes the member; records audit entry.
//   BanMember                — bans the member; records audit entry.
//
// Broadcasts:
//   SettingsChanged   — admins-only (carries snapshot). Settings views refetch.
//   AuditLogAppended  — public, empty payload. Tells dashboard/audit views to
//                       refetch (non-admin clients use it for the public
//                       dashboard counters).
//   AdminsChanged     — public, empty payload. Triggers GetAmIAdmin refresh.
// ============================================================================

// --- Enums ------------------------------------------------------------------
// Positive values only. Negative values are reserved for built-in SDK errors.
// Every enum member is prefixed with the enum name so the protobuf-ts
// generator strips it consistently and TS code reads the bare member.

enum ModerationError {
  MODERATION_ERROR_UNSPECIFIED = 0;
  MODERATION_ERROR_NOT_ADMIN = 1;
  MODERATION_ERROR_INVALID_SETTINGS = 2;
  MODERATION_ERROR_INVALID_WORD = 3;
  MODERATION_ERROR_NOT_FOUND = 4;
  MODERATION_ERROR_INVALID_TARGET = 5;
  // Per-admin rate limit on manual moderation actions tripped. Mirrors
  // the platform's command quota at the app level so a single admin
  // session can't rapid-fire kicks/bans/deletes.
  MODERATION_ERROR_RATE_LIMITED = 6;
}

// Why an action was taken. Stored on every audit entry so dashboard and
// analytics queries can group by it without joining.
enum RuleType {
  RULE_TYPE_UNSPECIFIED = 0;
  RULE_TYPE_CONTENT_FILTER = 1;
  RULE_TYPE_SPAM_DETECTION = 2;
  RULE_TYPE_RATE_LIMIT = 3;
  RULE_TYPE_MANUAL = 4;
  // Fired when a member's nickname matches the same content-filter
  // matchers (slurs / profanity / custom). Action is always BAN — see
  // server/src/usernameFilter.ts.
  RULE_TYPE_USERNAME_FILTER = 5;
  // Fired when a message contains a URL whose hostname (a) matches the
  // blocklist, (b) is missing from the allowlist (allowlist mode), or
  // (c) is a Root community invite link when block-root-invites is on.
  RULE_TYPE_URL_FILTER = 6;
  // Fired when a member who joined the community less than the
  // configured minimum-age threshold posts a message. Catches drive-by
  // spam without explicit content matching — see
  // server/src/messageHandler.ts and DESIGN.md → "New member gate".
  RULE_TYPE_NEW_MEMBER_GATE = 7;
  // Fired when a single message contains more user/role mentions than
  // the configured threshold. Counts come from the platform-supplied
  // referenceMaps so we don't re-parse mention markup. Catches "@here-
  // style" pile-on spam without rate-limit state — see
  // server/src/messageHandler.ts.
  RULE_TYPE_MENTION_SPAM = 8;
}

// What was done. The first three are taken automatically by the message
// handler; the last three are admin-initiated through the Audit Log /
// dashboard.
enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  ACTION_TYPE_DELETE_MESSAGE = 1;
  ACTION_TYPE_KICK = 2;
  ACTION_TYPE_BAN = 3;
  // Recorded immediately after the audit log is purged so the new log
  // starts with a self-documenting "log was cleared by admin X" row,
  // preserving the audit invariant for the action that wiped everything
  // else. Carries actorUserId; targetUserId / channelId are empty.
  ACTION_TYPE_CLEAR_AUDIT_LOG = 4;
  // Inverse of BAN. Surfaces in the audit log so an admin reading later
  // can see the full ban → unban arc. Carries targetUserId + actorUserId.
  ACTION_TYPE_UNBAN_MEMBER = 5;
}

// Which built-in word list a custom-words category entry belongs to. Allowed
// words live in their own list (separate enum value below) to keep the two
// concerns split — allowed never filters; categories always do (when their
// toggle is on).
enum WordCategory {
  WORD_CATEGORY_UNSPECIFIED = 0;
  WORD_CATEGORY_CUSTOM = 1;
  WORD_CATEGORY_ALLOWED = 2;
  // Domains for the URL filter. Stored in the same `words` table as
  // custom + allowed lists since the admin-managed shape is identical
  // (add, remove, toggle, search, paginate). Domain semantics differ
  // from word substring semantics — matching uses suffix comparison
  // against URL hostnames; see server/src/urlFilter.ts.
  WORD_CATEGORY_URL_DOMAIN = 3;
}

// URL filter mode — see UrlFilterSettings + server/src/urlFilter.ts.
//   BLOCKLIST: messages with any listed domain → deleted. Permissive default.
//   ALLOWLIST: messages with non-listed domains → deleted. Restrictive.
enum UrlFilterMode {
  URL_FILTER_MODE_UNSPECIFIED = 0;
  URL_FILTER_MODE_BLOCKLIST = 1;
  URL_FILTER_MODE_ALLOWLIST = 2;
}

// How spam detection scopes its "identical message" lookups.
enum SpamScope {
  SPAM_SCOPE_UNSPECIFIED = 0;
  SPAM_SCOPE_PER_CHANNEL = 1;
  SPAM_SCOPE_SERVER_WIDE = 2;
}

// --- Settings shapes --------------------------------------------------------

message ContentFilterSettings {
  bool enabled = 1;
  bool filter_slurs = 2;
  bool filter_profanity = 3;
  bool filter_custom_words = 4;
  bool warn_users = 5;
}

message SpamControlSettings {
  bool enabled = 1;
  // Number of identical messages required to trigger the rule. Range 2–100.
  int32 threshold = 2;
  // Lookback window in minutes. Range 1–1440.
  int32 window_minutes = 3;
  SpamScope scope = 4;
  bool warn_users = 5;
}

message RateLimitSettings {
  bool enabled = 1;
  // Max messages allowed in the window. Range 3–50.
  int32 max_messages = 2;
  // Window in seconds. Range 5–120.
  int32 window_seconds = 3;
}

message GeneralSettings {
  // Days to retain audit log entries. Range 7–365.
  int32 retention_days = 1;
}

// Username filter — matches member nicknames against the content filter's
// compiled regex (slurs/profanity/custom + allowed-words cancellation).
// On match, the member is banned via communityMemberBans.create. Triggers
// on UserSetProfile (nickname change) and CommunityMemberAttach (catches
// violating nicknames at first attach).
message UsernameFilterSettings {
  bool enabled = 1;
}

// URL filter — matches URLs in messages against an admin-managed domain
// list. URLs are extracted from both messageUris[] (platform-detected
// links + attachments) AND a regex pass over messageContent (catches
// plain-text URLs that the platform didn't auto-detect).
message UrlFilterSettings {
  bool enabled = 1;
  UrlFilterMode mode = 2;
  // Block any URL that is a Root community invite link (rootapp.gg/<code>
  // shape). Independent of the blocklist/allowlist mode — even on
  // BLOCKLIST mode with an empty list, this gate still fires when on.
  // Useful for communities that don't want members posting links to
  // OTHER Root communities (a common spam vector).
  bool block_root_invites = 3;
  bool warn_users = 4;
}

// Mention spam — caps user+role mentions per message. Stateless: each
// message is judged on its own mention count, no per-user windowing.
// Counts come straight from the platform's referenceMaps (users + roles
// arrays), so the rule sees what the chat client renders, not what the
// raw text says — copy-paste of mention markup that doesn't resolve to
// a real user/role doesn't count. Slot in evaluateInlineRules so the
// check also runs on edits (a clean message edited to add 30 mentions
// hits the same threshold).
message MentionSpamSettings {
  bool enabled = 1;
  // Max mentions (users + roles, summed) allowed in a single message.
  // Range 1–50. Defaults to 10 in DEFAULT_MENTION_SPAM — generous enough
  // for legitimate "thanks @a @b @c @d @e" rollups, tight enough that
  // an @everyone-style pile-on trips it.
  int32 max_mentions_per_message = 2;
  bool warn_users = 3;
}

// New member gate — short-circuits the rule pipeline for messages from
// members who joined the community less than `min_minutes` ago. Catches
// drive-by spam without content matching (the cheapest possible rule:
// integer compare against `joinedAt`). Off by default — gating fresh
// members has real false-positive cost (legitimate new joiners can't
// post until the threshold passes).
message NewMemberGateSettings {
  bool enabled = 1;
  // Minimum minutes since `joinedAt` before a member can post in
  // monitored channels. Range 1–10080 (1 minute to 7 days).
  int32 min_minutes = 2;
  bool warn_users = 3;
}

// Server-side validation bounds. The client renders form min/max from these
// so the bounds stay in lockstep with server-side validation — no constant
// duplication. Mirrors the leveling-leaderboard pattern.
message SettingsLimits {
  int32 spam_threshold_min = 1;
  int32 spam_threshold_max = 2;
  int32 spam_window_minutes_min = 3;
  int32 spam_window_minutes_max = 4;
  int32 rate_limit_max_messages_min = 5;
  int32 rate_limit_max_messages_max = 6;
  int32 rate_limit_window_seconds_min = 7;
  int32 rate_limit_window_seconds_max = 8;
  int32 retention_days_min = 9;
  int32 retention_days_max = 10;
  int32 word_max_length = 11;
  int32 new_member_gate_min_minutes_min = 12;
  int32 new_member_gate_min_minutes_max = 13;
  int32 mention_spam_max_mentions_min = 14;
  int32 mention_spam_max_mentions_max = 15;
}

// --- Audit log entry --------------------------------------------------------

message AuditEntry {
  // DB-assigned auto-increment id. Stable across the entry's lifetime; used
  // as the React key on the client.
  int64 id = 1;
  // Milliseconds since Unix epoch.
  int64 timestamp = 2;
  ActionType action = 3;
  RuleType rule = 4;
  // The user the action targeted.
  string target_user_id = 5;
  // Channel where the offending message was posted, if applicable. Empty for
  // a kick/ban that wasn't tied to a specific message.
  string channel_id = 6;
  string channel_name = 7;
  // Persisted-at-time-of-action community nickname (the SDK's
  // `CommunityMember.nickname` — what the user was called in chat when
  // this row was written). The user-facing UI labels this "Username"
  // since that's how Root admins refer to it; the proto field tracks
  // the SDK term to teach the underlying API. See DESIGN.md →
  // "Audit log nicknames" for why this isn't the global username.
  string target_nickname = 8;
  // The text that triggered the rule, truncated server-side.
  string message_excerpt = 9;
  // The word/term that matched (content filter only).
  string matched_term = 10;
  // True when an admin took the action; false when automated.
  bool manual = 11;
  // Admin user who took the action. Empty for automated entries.
  string actor_user_id = 12;
  // Persisted-at-time-of-action nickname for the admin actor. Same
  // resolver + frozen-at-write semantics as target_nickname. Empty for
  // automated entries (rule pipeline) since there's no human actor.
  string actor_nickname = 13;
}

// --- Dashboard --------------------------------------------------------------

message GetDashboardRequest {}

message DashboardSummary {
  int32 total_actions_24h = 1;
  int32 content_filtered_24h = 2;
  int32 manual_actions_24h = 3;
}

message GetDashboardResponse {
  DashboardSummary summary = 1;
  // Most recent entries (any rule type), newest first.
  repeated AuditEntry recent = 2;
  // Caller's admin flag — same flag as GetSettings.is_admin / GetAmIAdmin.
  // Bundled here so the dashboard can render admin-only chrome (gear,
  // manual-action menus on rows) without a second round trip.
  bool am_i_admin = 3;
  // Channel display names currently in the monitored set. Empty when the
  // app is monitoring everything (see monitoring_all). Resolved from the
  // server-side channelNameCache so the client doesn't N+1 lookup names.
  repeated string monitored_channel_names = 4;
  // True when the monitored set is empty, which by design.md means
  // "monitor every channel this app has access to" — the at-a-glance
  // affordance the dashboard surfaces alongside the activity counters.
  bool monitoring_all = 5;
}

// --- Analytics --------------------------------------------------------------

enum AnalyticsRange {
  ANALYTICS_RANGE_UNSPECIFIED = 0;
  ANALYTICS_RANGE_LAST_24H = 1;
  ANALYTICS_RANGE_LAST_7D = 2;
  ANALYTICS_RANGE_LAST_30D = 3;
}

message GetAnalyticsRequest {
  AnalyticsRange range = 1;
}

// One bucket of the stacked-bar chart. Buckets are hour-sized for 24h, day-
// sized for 7d / 30d. Aligned to UTC midnight for day buckets.
message AnalyticsBucket {
  int64 timestamp = 1;
  int32 content_filter = 2;
  int32 spam = 3;
  int32 rate_limit = 4;
  int32 manual = 5;
}

message ChannelActivity {
  string channel_id = 1;
  string channel_name = 2;
  int32 count = 3;
}

message GetAnalyticsResponse {
  int32 total = 1;
  int32 content_filter_total = 2;
  int32 spam_total = 3;
  int32 rate_limit_total = 4;
  int32 manual_total = 5;
  repeated AnalyticsBucket buckets = 6;
  repeated ChannelActivity top_channels = 7;
}

// --- Audit log query --------------------------------------------------------

message ListAuditLogRequest {
  // Opaque cursor — round-trip whatever the server returned. Empty = first
  // page. Encoding is server-internal (see auditLogStore.ts).
  string cursor = 1;
  int32 page_size = 2;

  // All filters are AND-combined. Empty/zero = "no filter on that axis".
  // Substring match against the persisted target_nickname (the SDK's
  // community nickname — see AuditEntry.target_nickname).
  string nickname_filter = 3;
  ActionType action_filter = 4;
  RuleType rule_filter = 5;
  // Inclusive UTC ms-epoch lower bound. 0 = no lower bound.
  int64 from_timestamp = 6;
  // Exclusive UTC ms-epoch upper bound. 0 = no upper bound.
  int64 to_timestamp = 7;
}

message ListAuditLogResponse {
  repeated AuditEntry entries = 1;
  // Empty when there are no more pages.
  string next_cursor = 2;
  // Total matching the filters across the entire log. Useful for "Showing 1-20
  // of N" affordances; computed once per call (not cached).
  int32 total_matches = 3;
}

// Per-user infraction history, derived from audit_log rows targeting a
// single user. Returned by GetMemberSummary; fetched on-demand when an
// admin expands an audit-log row's chevron to drill into "is this user
// a repeat offender?" UNSPECIFIED-rule rows (rule-pipeline-failure
// records) are excluded so internal-failure noise doesn't inflate the
// counts — same exclusion as the dashboard totals.
message GetMemberSummaryRequest {
  string user_id = 1;
}

message MemberRuleCount {
  RuleType rule = 1;
  int32 count = 2;
}

message GetMemberSummaryResponse {
  // Frozen nickname from the user's most recent audit row. Empty when
  // they have no audit history (e.g., the row's targetUserId resolved
  // to a member who's never been touched by another rule).
  string nickname = 1;
  int32 total_events = 2;
  // Per-rule counts. Only includes rules that have at least one event;
  // empty entries aren't returned. The client renders one chip per
  // entry, sorted by count descending in the UI.
  repeated MemberRuleCount by_rule = 3;
  // ms epoch of earliest / latest event for this user. 0 when no events.
  int64 first_event_at = 4;
  int64 last_event_at = 5;
}

// --- Word lists -------------------------------------------------------------

message Word {
  int64 id = 1;
  string text = 2;
  WordCategory category = 3;
  bool enabled = 4;
}

message ListWordsRequest {
  WordCategory category = 1;
  // Substring match against the word text. Case-insensitive.
  string search = 2;
  string cursor = 3;
  int32 page_size = 4;
}

message ListWordsResponse {
  repeated Word words = 1;
  string next_cursor = 2;
  int32 total_matches = 3;
}

message AddWordRequest {
  WordCategory category = 1;
  string text = 2;
}

message AddWordResponse {
  Word word = 1;
}

message SetWordEnabledRequest {
  int64 id = 1;
  bool enabled = 2;
}

message SetWordEnabledResponse {}

message RemoveWordRequest {
  int64 id = 1;
}

message RemoveWordResponse {}

// Bulk import of word entries — paste a list rather than clicking Add
// per word. Server splits each input on commas + newlines, normalizes,
// deduplicates within the input, and skips entries already in the list.
// Returns counts so the UI can surface "Added 47, 3 duplicates, 2 invalid".
message ImportWordsRequest {
  WordCategory category = 1;
  // Raw input strings — typically each one is a single word, but the
  // server tolerates internal commas and newlines so admins can paste
  // a CSV or newline-separated list directly into one entry.
  repeated string texts = 2;
}

message ImportWordsResponse {
  // Successfully inserted + cache-invalidated.
  int32 added_count = 1;
  // Already in the list (matched on normalized text + category).
  int32 duplicate_count = 2;
  // Empty after normalization, or over the wordMaxLength cap.
  int32 invalid_count = 3;
}

// --- Settings ---------------------------------------------------------------

message MonitoredChannels {
  // Channels the app monitors. Empty list means "all channels are monitored"
  // (per design.md "Monitored channels"). Server enforces the empty-means-all
  // semantic.
  repeated string channel_ids = 1;
}

message Channel {
  string channel_id = 1;
  string name = 2;
  bool monitored = 3;
}

message ChannelGroup {
  string channel_group_id = 1;
  string name = 2;
  repeated Channel channels = 3;
}

message GetSettingsRequest {}

// Snapshot of the globalSettings.general.exempt picker. Read-only on the
// client side (the picker itself lives in Root's native Settings UI).
// Surfaced here so the General tab can show admins who's currently
// exempt without an extra round trip.
message ExemptSelection {
  // Bare user IDs as picked. Resolving these to display names client-side
  // would require a profiles fetch we skip here; the General tab renders
  // them as raw IDs (a future enhancement could batch a profiles RPC).
  repeated string user_ids = 1;
  // Roles with display names + colors resolved server-side from
  // communityRoles.list() during GetSettings. Done server-side because
  // .list() is already a round-trip and roles are bounded — cheaper than
  // a separate client RPC.
  repeated ExemptRole roles = 2;
}

message ExemptRole {
  string id = 1;
  string name = 2;
  // Hex color (e.g. "#7289DA") so the General tab can render role Pills
  // with Root's role-mention color convention. Empty when the role has
  // no color configured.
  string color_hex = 3;
}

message GetSettingsResponse {
  ContentFilterSettings content_filter = 1;
  SpamControlSettings spam_control = 2;
  RateLimitSettings rate_limit = 3;
  GeneralSettings general = 4;
  MonitoredChannels monitored = 5;
  SettingsLimits limits = 6;
  // Channel tree for the monitored-channels picker. Bundled here so the
  // Settings view doesn't need a second RPC just to render the tree.
  repeated ChannelGroup channel_tree = 7;
  // Word counts so the Settings tab can show "120 custom words" without
  // loading every word.
  int32 custom_word_count = 8;
  int32 allowed_word_count = 9;
  // Read-only snapshot of who's currently exempt from automated rules
  // (per globalSettings.general.exempt). The picker itself is managed in
  // Root's native Settings UI; the General tab shows this for visibility.
  ExemptSelection exempt = 10;
  UsernameFilterSettings username_filter = 11;
  UrlFilterSettings url_filter = 12;
  // Counts so the URL filter Settings panel can show "120 blocked
  // domains" without loading every row. Same shape as custom_word_count
  // and allowed_word_count above.
  int32 url_domain_count = 13;
  NewMemberGateSettings new_member_gate = 14;
  MentionSpamSettings mention_spam = 15;
}

// Per-field setters. Each Settings tab's editable fields each get their own
// RPC so concurrent admin edits to different fields don't coalesce into a
// payload that re-stomps unrelated fields. Mirrors github-release-watcher's
// per-row, per-field RPC shape. Server uses dataStore.appData.update() for
// atomic per-field merges.

message SetContentFilterEnabledRequest { bool enabled = 1; }
message SetFilterSlursRequest { bool enabled = 1; }
message SetFilterProfanityRequest { bool enabled = 1; }
message SetFilterCustomWordsRequest { bool enabled = 1; }
message SetContentFilterWarnUsersRequest { bool enabled = 1; }

message SetSpamEnabledRequest { bool enabled = 1; }
message SetSpamThresholdRequest { int32 threshold = 1; }
message SetSpamWindowRequest { int32 window_minutes = 1; }
message SetSpamScopeRequest { SpamScope scope = 1; }
message SetSpamWarnUsersRequest { bool enabled = 1; }

message SetRateLimitEnabledRequest { bool enabled = 1; }
message SetRateLimitMaxRequest { int32 max_messages = 1; }
message SetRateLimitWindowRequest { int32 window_seconds = 1; }

message SetRetentionDaysRequest { int32 days = 1; }

message SetUsernameFilterEnabledRequest { bool enabled = 1; }

message SetUrlFilterEnabledRequest { bool enabled = 1; }
message SetUrlFilterModeRequest { UrlFilterMode mode = 1; }
message SetUrlFilterBlockRootInvitesRequest { bool enabled = 1; }
message SetUrlFilterWarnUsersRequest { bool enabled = 1; }

message SetNewMemberGateEnabledRequest { bool enabled = 1; }
message SetNewMemberGateMinMinutesRequest { int32 min_minutes = 1; }
message SetNewMemberGateWarnUsersRequest { bool enabled = 1; }

message SetMentionSpamEnabledRequest { bool enabled = 1; }
message SetMentionSpamMaxMentionsRequest { int32 max_mentions = 1; }
message SetMentionSpamWarnUsersRequest { bool enabled = 1; }

// Empty response shared by every per-field setter — the success of the RPC
// itself is the only signal needed; updated state arrives via the
// SettingsChanged broadcast.
message SetSettingsFieldResponse {}

message UpdateMonitoredChannelsRequest {
  repeated string channel_ids = 1;
}
message UpdateMonitoredChannelsResponse {}

// --- Client error telemetry ------------------------------------------------
//
// Funnels client-side render errors caught by ErrorBoundary into the
// server's structured log so production crashes are visible to operators
// instead of stuck in browser consoles. Server caps each field, drops
// oversized requests outright, and rate-limits per caller so a render-loop
// boundary can't flood the log pipeline.

message ReportClientErrorRequest {
  // Free-form label identifying the boundary (e.g., "App", "Dashboard",
  // "Settings"). Helps disambiguate traces from different views.
  string label = 1;
  string message = 2;
  // Stack trace as captured by the browser. Empty when unavailable.
  string stack = 3;
  // navigator.userAgent. Empty when omitted.
  string user_agent = 4;
}

message ReportClientErrorResponse {}

// --- Admin flag refresh -----------------------------------------------------

message GetAmIAdminRequest {}
message GetAmIAdminResponse {
  bool am_i_admin = 1;
}

// --- Manual actions ---------------------------------------------------------

message DeleteMessageManualRequest {
  string channel_id = 1;
  string message_id = 2;
  // Optional admin-supplied reason recorded on the audit entry's
  // messageExcerpt. Standardized across every manual-action RPC for
  // consistency — same field name on Kick / Ban / Unban / Delete.
  string reason = 3;
}
message DeleteMessageManualResponse {}

message KickMemberRequest {
  string user_id = 1;
  // Optional admin-supplied reason recorded on the audit entry.
  string reason = 2;
}
message KickMemberResponse {}

message BanMemberRequest {
  string user_id = 1;
  string reason = 2;
  // Optional ban expiry as ms-epoch. 0 (default) = permanent. Surfaces the
  // SDK's `communityMemberBans.create({ expiresAt })` capability so admins
  // can issue cool-off bans without scheduling their own un-ban; the SDK
  // lifts the ban automatically when the timestamp passes.
  int64 expires_at = 3;
}
message BanMemberResponse {}

// Lift an existing ban. The SDK rejects the call if the user isn't
// currently banned, so the server doesn't need to pre-check — it
// surfaces the SDK's NotFound as INVALID_TARGET. The ban list view
// only renders Unban for currently-banned users in the first place,
// so this should be the rare race-only path.
message UnbanMemberRequest {
  string user_id = 1;
  // Optional admin-supplied reason recorded on the audit entry.
  // Useful for "I'm unbanning because we resolved this in moderation
  // chat" so the log captures the human context.
  string reason = 2;
}
message UnbanMemberResponse {}

// State-pivot view of who's currently banned. Distinct from the audit
// log (which is the event history): bans automatically expire (temp
// bans), get lifted by admins, or get re-applied — the audit log shows
// every event in that arc, but admins managing live bans want the
// current state, not the history. See DESIGN.md → "Banned members".
message ListBannedMembersRequest {}

message ListBannedMembersResponse {
  repeated BannedMember members = 1;
}

message BannedMember {
  string user_id = 1;
  // Frozen-at-time-of-ban nickname pulled via the same nicknameCache
  // the audit-write path uses. Identical to the targetNickname recorded
  // on the BAN audit row.
  string nickname = 2;
  // Reason recorded on the ban — admin-supplied free text. Empty when
  // the ban was issued without a reason.
  string reason = 3;
  // ms-epoch UTC. 0 = permanent. Surfaced so the UI can render
  // "expires in 2 days" affordances.
  int64 expires_at = 4;
}

// Type-to-confirm gated audit-log purge. Server validates the typed phrase
// matches the canonical "clear audit log" string (case-insensitive, trimmed)
// before doing the DELETE — defence in depth against a malformed client or
// a user who bypassed the in-app confirm UI by calling the RPC directly.
message ClearAuditLogRequest {
  string confirmation_phrase = 1;
}
message ClearAuditLogResponse {
  // Reported back so the UI can surface "cleared N entries" — useful both
  // as feedback and so the action's effect is explicit even when the audit
  // log refresh broadcast hasn't landed yet.
  int32 rows_deleted = 1;
}

// --- Broadcasts -------------------------------------------------------------

// Fires after any settings, word-list, or monitored-channels mutation.
// Admin-only audience because the client uses the snapshot to refresh views
// that themselves are admin-gated. Carries no payload — receivers re-fetch.
message SettingsChangedEvent {}

// Fires whenever a new audit entry is written (automated or manual). All
// connected clients receive it; non-admin clients use it to refresh their
// dashboard counters and recent-events list. Carries no payload — receivers
// re-fetch the slice they care about.
message AuditLogAppendedEvent {}

// Public; fires when globalSettings.general.admins changes. Receivers fire
// GetAmIAdmin to refresh their flag.
message AdminsChangedEvent {}

// --- Service ----------------------------------------------------------------

service ModerationService {
  // Public.
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);
  rpc GetAnalytics(GetAnalyticsRequest) returns (GetAnalyticsResponse);
  rpc GetAmIAdmin(GetAmIAdminRequest) returns (GetAmIAdminResponse);

  // Public — error telemetry funnel. Truncated + rate-limited server-side
  // so a render-loop ErrorBoundary can't flood the log pipeline.
  rpc ReportClientError(ReportClientErrorRequest) returns (ReportClientErrorResponse);

  // Admin-only. Server throws ModerationError.NOT_ADMIN otherwise.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);

  // Per-field setters for each Settings tab (see request-message comments for
  // the rationale).
  rpc SetContentFilterEnabled(SetContentFilterEnabledRequest) returns (SetSettingsFieldResponse);
  rpc SetFilterSlurs(SetFilterSlursRequest) returns (SetSettingsFieldResponse);
  rpc SetFilterProfanity(SetFilterProfanityRequest) returns (SetSettingsFieldResponse);
  rpc SetFilterCustomWords(SetFilterCustomWordsRequest) returns (SetSettingsFieldResponse);
  rpc SetContentFilterWarnUsers(SetContentFilterWarnUsersRequest) returns (SetSettingsFieldResponse);

  rpc SetSpamEnabled(SetSpamEnabledRequest) returns (SetSettingsFieldResponse);
  rpc SetSpamThreshold(SetSpamThresholdRequest) returns (SetSettingsFieldResponse);
  rpc SetSpamWindow(SetSpamWindowRequest) returns (SetSettingsFieldResponse);
  rpc SetSpamScope(SetSpamScopeRequest) returns (SetSettingsFieldResponse);
  rpc SetSpamWarnUsers(SetSpamWarnUsersRequest) returns (SetSettingsFieldResponse);

  rpc SetRateLimitEnabled(SetRateLimitEnabledRequest) returns (SetSettingsFieldResponse);
  rpc SetRateLimitMax(SetRateLimitMaxRequest) returns (SetSettingsFieldResponse);
  rpc SetRateLimitWindow(SetRateLimitWindowRequest) returns (SetSettingsFieldResponse);

  rpc SetRetentionDays(SetRetentionDaysRequest) returns (SetSettingsFieldResponse);

  rpc SetUsernameFilterEnabled(SetUsernameFilterEnabledRequest) returns (SetSettingsFieldResponse);

  rpc SetUrlFilterEnabled(SetUrlFilterEnabledRequest) returns (SetSettingsFieldResponse);
  rpc SetUrlFilterMode(SetUrlFilterModeRequest) returns (SetSettingsFieldResponse);
  rpc SetUrlFilterBlockRootInvites(SetUrlFilterBlockRootInvitesRequest) returns (SetSettingsFieldResponse);
  rpc SetUrlFilterWarnUsers(SetUrlFilterWarnUsersRequest) returns (SetSettingsFieldResponse);

  rpc SetNewMemberGateEnabled(SetNewMemberGateEnabledRequest) returns (SetSettingsFieldResponse);
  rpc SetNewMemberGateMinMinutes(SetNewMemberGateMinMinutesRequest) returns (SetSettingsFieldResponse);
  rpc SetNewMemberGateWarnUsers(SetNewMemberGateWarnUsersRequest) returns (SetSettingsFieldResponse);

  rpc SetMentionSpamEnabled(SetMentionSpamEnabledRequest) returns (SetSettingsFieldResponse);
  rpc SetMentionSpamMaxMentions(SetMentionSpamMaxMentionsRequest) returns (SetSettingsFieldResponse);
  rpc SetMentionSpamWarnUsers(SetMentionSpamWarnUsersRequest) returns (SetSettingsFieldResponse);

  rpc UpdateMonitoredChannels(UpdateMonitoredChannelsRequest) returns (UpdateMonitoredChannelsResponse);

  rpc ListWords(ListWordsRequest) returns (ListWordsResponse);
  rpc AddWord(AddWordRequest) returns (AddWordResponse);
  rpc SetWordEnabled(SetWordEnabledRequest) returns (SetWordEnabledResponse);
  rpc RemoveWord(RemoveWordRequest) returns (RemoveWordResponse);
  rpc ImportWords(ImportWordsRequest) returns (ImportWordsResponse);

  rpc ListAuditLog(ListAuditLogRequest) returns (ListAuditLogResponse);
  rpc GetMemberSummary(GetMemberSummaryRequest) returns (GetMemberSummaryResponse);

  rpc DeleteMessageManual(DeleteMessageManualRequest) returns (DeleteMessageManualResponse);
  rpc KickMember(KickMemberRequest) returns (KickMemberResponse);
  rpc BanMember(BanMemberRequest) returns (BanMemberResponse);
  rpc UnbanMember(UnbanMemberRequest) returns (UnbanMemberResponse);
  rpc ListBannedMembers(ListBannedMembersRequest) returns (ListBannedMembersResponse);

  rpc ClearAuditLog(ClearAuditLogRequest) returns (ClearAuditLogResponse);

  // Broadcasts.
  rpc BroadcastSettingsChanged(SettingsChangedEvent) returns (rootsdk.Void);
  rpc BroadcastAuditLogAppended(AuditLogAppendedEvent) returns (rootsdk.Void);
  rpc BroadcastAdminsChanged(AdminsChangedEvent) returns (rootsdk.Void);
}
