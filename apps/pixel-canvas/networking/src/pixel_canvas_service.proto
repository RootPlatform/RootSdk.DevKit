syntax = "proto3";

import "rootsdk/types.proto";

// ============================================================================
// PixelCanvasService
//
// See DESIGN.md for the full behavior contract. Briefly:
//   - A single shared pixel grid. Members place colored pixels from a
//     fixed palette; anyone can overwrite anyone (r/place model).
//   - Per-user cooldown enforced server-side via an in-memory Map. The
//     cooldown slot is claimed synchronously (no await between read/check
//     and claim) so concurrent same-user requests can't bypass it. KV
//     writes for the canvas blob serialize through an in-process queue
//     so different-user placements don't blob-overwrite each other. See
//     canvasStore.ts for the full atomicity story.
//   - Admins (globalSettings.general.admins + community owner) can
//     change cooldown, canvas size, and clear the canvas.
//
// Auth gates:
//   - GetCanvas, PlacePixel, ReportClientError: any authenticated client.
//   - GetSettings, UpdateSettings, ClearCanvas: admin-only via
//     requireAdmin (throws RootServerException(NOT_ADMIN) otherwise).
//
// Broadcast audiences:
//   - PixelPlaced, CanvasCleared, SettingsChanged, AdminsChanged: all "all".
//   - Settings payloads carry no sensitive data — picker config is the
//     same for everyone (cooldown is public, canvas size is public).
//     Compare leveling-leaderboard's SettingsUpdated which is admin-only
//     because its payload carried per-member XP-eligibility data.
// ============================================================================

// --- Core types -------------------------------------------------------------

// Per-pixel metadata. Stored sparsely (only PLACED pixels have entries; cleared
// or never-touched cells are absent and render as the empty-canvas color).
message PixelData {
  // Index into the palette returned by GetCanvas.palette. Wire-efficient
  // alternative to a hex string: 1 byte (varint) vs ~9 bytes per entry,
  // ~28KB savings on a fully-painted 64×64 GetCanvas snapshot. Clients
  // resolve this against their cached palette to get the actual hex
  // color for rendering. Server validates `palette_index < palette.length`
  // on placement; an out-of-range value is rejected with INVALID_COLOR.
  //
  // Storage is hex on the server (KV blob holds the canonical hex
  // string) — only the wire is indexed. Decoupling storage from the
  // wire format means a future palette mutation can't invalidate stored
  // history; the index is computed at the wire boundary in
  // pixelCanvasService.ts.
  uint32 palette_index = 1;
  // Last placer of this pixel. Surfaced in the action-panel info during
  // preview ("placed by @alice, 3 min ago").
  string user_id = 2;
  // ms epoch. Server-authoritative (not client-supplied). Used for
  // relative-time rendering and as a fallback ordering signal.
  int64 placed_at = 3;
}

message PixelEntry {
  int32 x = 1;
  int32 y = 2;
  PixelData data = 3;
}

// Min/max bounds for AppSettings fields. Server is source of truth; client
// reads these from GetCanvas / GetSettings to render Settings form bounds.
// Avoids drift between server-side validation and client-side input limits.
message CanvasLimits {
  int32 cooldown_seconds_min = 1;
  int32 cooldown_seconds_max = 2;
  // Canvas dimensions are restricted to a small set of square sizes for
  // sample simplicity. Non-square or arbitrary sizes are a fork option.
  repeated int32 allowed_canvas_sizes = 3;
}

// --- Errors -----------------------------------------------------------------
// Positive values only. Negative values are reserved for built-in SDK errors.

enum PixelCanvasError {
  PIXEL_CANVAS_ERROR_UNSPECIFIED = 0;
  PIXEL_CANVAS_ERROR_NOT_ADMIN = 1;
  // PlacePixel attempted before the caller's cooldown elapsed. Client
  // should surface this as "wait Ns" in the action panel — though under
  // normal use the client's countdown blocks the call before it ever
  // reaches the server.
  PIXEL_CANVAS_ERROR_COOLDOWN_NOT_ELAPSED = 2;
  // PlacePixel x/y is outside the current canvas bounds. Stale client
  // (admin shrunk the canvas mid-session) or hostile request.
  PIXEL_CANVAS_ERROR_INVALID_COORDINATES = 3;
  // PlacePixel palette_index is out of bounds for the server's palette
  // (PALETTE.length). Wire is indexed (see PixelData.palette_index)
  // so this is a simple integer bounds check, not a hex-string
  // membership test.
  PIXEL_CANVAS_ERROR_INVALID_COLOR = 4;
  // UpdateSettings cooldown_seconds or canvas_size out of allowed range.
  PIXEL_CANVAS_ERROR_INVALID_SETTINGS = 5;
}

// --- Member-facing RPCs -----------------------------------------------------

// Lightweight per-caller refresh of just the admin flag. Client fires
// this on AdminsChanged broadcasts instead of refetching the full
// GetCanvas snapshot — refetching ~200 KB of pixel data to update one
// boolean every time globalSettings.general.admins flaps was the
// dominant wire-efficiency miss before this RPC existed. Response is
// 1 byte; bounded thundering herd on each broadcast (every connected
// client fires one) is fine because each call is tiny.
message GetAmIAdminRequest {}
message GetAmIAdminResponse {
  bool am_i_admin = 1;
}

message GetCanvasRequest {}

message GetCanvasResponse {
  int32 width = 1;
  int32 height = 2;
  // Sparse — only placed pixels appear here. Empty cells are absent and
  // render client-side as a neutral background (--rootsdk-background-tertiary).
  repeated PixelEntry pixels = 3;
  // Caller's last-placement timestamp (ms epoch, 0 if never placed). Used
  // by the client to compute remaining cooldown locally. Per-caller
  // value — populated from the server's per-user cooldown map.
  int64 my_last_placed_at = 4;
  int32 cooldown_seconds = 5;
  // Allowed color palette. Hex strings, validated against this list on
  // PlacePixel server-side. Sent to the client so the picker UI doesn't
  // need a hardcoded list (single source of truth on the server).
  repeated string palette = 6;
  bool am_i_admin = 7;
  CanvasLimits limits = 8;
}

message PlacePixelRequest {
  int32 x = 1;
  int32 y = 2;
  // Index into the palette returned by GetCanvas.palette. The client
  // resolves the user's selected hex color to its index before sending;
  // server bounds-checks against PALETTE.length and rejects with
  // INVALID_COLOR if out of range. Indexed wire eliminates the
  // "client smuggles an arbitrary hex string" attack surface entirely
  // — there's nothing to validate against a list, just an integer
  // bounds check.
  uint32 palette_index = 3;
}

message PlacePixelResponse {
  // Server's authoritative placement timestamp (ms epoch). Client uses this
  // to update its local "next allowed at" countdown without waiting for
  // the broadcast to arrive.
  int64 placed_at = 1;
}

// --- Admin-only RPCs --------------------------------------------------------

// Wholesale settings replace. Concurrent admin edits would otherwise need
// finer-grained patches (UpdateCooldown, UpdateSize). Keeping a single
// snapshot RPC simplifies the contract; auto-save debounce + last-writer-
// wins is acceptable for a config edited by a handful of people.
//
// No GetSettings RPC: the client reads cooldownSeconds + canvasSize +
// limits straight off CanvasContext (populated from GetCanvas). A
// separate GetSettings would be a redundant fetch for the same data
// — see DESIGN.md.
message UpdateSettingsRequest {
  int32 cooldown_seconds = 1;
  int32 canvas_size = 2;
}
message UpdateSettingsResponse {}

// Wipe the canvas. Returns when storage is committed. The associated
// CanvasCleared broadcast carries the dimensions so clients reset their
// local state to a fresh empty grid.
message ClearCanvasRequest {}
message ClearCanvasResponse {}

// --- Client telemetry -------------------------------------------------------
//
// Funnels client-side render errors caught by ErrorBoundary into the server's
// structured log. Same shape as leveling-leaderboard / self-roles.

message ReportClientErrorRequest {
  string label = 1;
  string message = 2;
  string stack = 3;
  string user_agent = 4;
}
message ReportClientErrorResponse {}

// --- Broadcasts -------------------------------------------------------------

// Public. Fires for every successful PlacePixel. High-frequency by design —
// per-pixel events are the demo. Per-user cooldown caps total rate to
// active_users / cooldown_sec.
//
// Color crosses the wire as a palette_index (varint, 1 byte for our
// 16-color palette) rather than a hex string (~9 bytes including proto
// framing). At max community traffic (1k painters at 30s cooldown ≈ 33
// events/sec), that's ~250 KB/sec of redundant color-string bytes
// removed from the global fanout. Clients resolve against their cached
// palette to render. Same encoding rationale as PixelData.palette_index.
//
// Audience uses `except: client` (the placer) — they got `placed_at`
// in the direct PlacePixel response and applied locally via
// applyOwnPlacement, so echoing the broadcast back to them is dead
// weight. See pixelCanvasService.placePixel.
message PixelPlacedEvent {
  int32 x = 1;
  int32 y = 2;
  uint32 palette_index = 3;
  string user_id = 4;
  int64 placed_at = 5;
}

// Public. Fires when an admin clears the canvas, or as a side effect of a
// canvas-size change. Carries new dimensions so clients can re-render an
// empty grid of the right shape without a full GetCanvas refetch.
message CanvasClearedEvent {
  int32 width = 1;
  int32 height = 2;
}

// Public. Fires when an admin saves new cooldown / size settings. Clients
// update their local cooldown computation; size changes are paired with a
// CanvasCleared since size changes always wipe the canvas.
message SettingsChangedEvent {
  int32 cooldown_seconds = 1;
  int32 canvas_size = 2;
}

// Public empty signal. Fires when globalSettings.general.admins shifts.
// Clients re-fetch GetCanvas to refresh amIAdmin. Mirrors the same pattern
// in leveling-leaderboard and self-roles.
message AdminsChangedEvent {}

// --- Service ---------------------------------------------------------------

service PixelCanvasService {
  rpc GetCanvas(GetCanvasRequest) returns (GetCanvasResponse);
  rpc GetAmIAdmin(GetAmIAdminRequest) returns (GetAmIAdminResponse);
  rpc PlacePixel(PlacePixelRequest) returns (PlacePixelResponse);

  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  rpc ClearCanvas(ClearCanvasRequest) returns (ClearCanvasResponse);

  rpc ReportClientError(ReportClientErrorRequest) returns (ReportClientErrorResponse);

  rpc BroadcastPixelPlaced(PixelPlacedEvent) returns (rootsdk.Void);
  rpc BroadcastCanvasCleared(CanvasClearedEvent) returns (rootsdk.Void);
  rpc BroadcastSettingsChanged(SettingsChangedEvent) returns (rootsdk.Void);
  rpc BroadcastAdminsChanged(AdminsChangedEvent) returns (rootsdk.Void);
}
