syntax = "proto3";
package datapaginatedlist;

// ============================================================================
// ListService — cursor-based pagination over a server-side list of records.
//
// This recipe composes server-database (the SQLite-backed records) and
// networking-app-services (the RPC plumbing). The client accumulates pages
// by calling ListRecords repeatedly with the previous response's next_cursor.
// ============================================================================

// Page request. Both fields optional.
//
// page_size — the maximum number of records the server should return in
// this page. Server caps to a sensible upper bound regardless of what the
// client asks for; clients can't ask for "everything" by sending a huge
// page_size and skipping pagination entirely. 0 means "use the server's
// default" (which the server picks; the recipe uses 20).
//
// cursor — opaque pagination cursor returned by the previous call's
// next_cursor field. Empty string means "first page". Clients never
// inspect or construct cursors — they round-trip the value the server
// gave them. Server owns the encoding (this recipe uses base64-encoded
// JSON of the last seen id AND the search term it was issued under), and
// is free to change it without breaking clients. A cursor is only meaningful
// within the query that produced it: pairing one with a different `search`
// seeks into the middle of a result set it never described, so the server
// detects the mismatch and starts over.
//
// search — optional case-insensitive substring filter, applied by the SERVER
// against the record label. This field exists because the alternative is a
// silent bug: a client that fetches a page and filters it locally can only
// ever find matches inside the page it happens to hold, and there is no
// error, no empty state, and no symptom until the list outgrows one page.
// A filtered list is still paginated — the filter narrows what is paged
// over, it does not replace paging.
message ListRecordsRequest {
  uint32 page_size = 1;
  string cursor = 2;
  string search = 3;
}

// Page response.
//
// records — up to page_size items, ordered newest first (highest id first).
// next_cursor — opaque cursor for the NEXT call. Empty string when there
// are no more pages. Empty-string-means-end is simpler than a separate
// has_more boolean: one field, one branch in the client state machine.
message ListRecordsResponse {
  repeated Record records = 1;
  string next_cursor = 2;
}

// One record. The label is placeholder data — fork the recipe and replace
// `Record` (and the seed in db.ts) with whatever your real list shape is:
// audit-log entries, posts, items in a queue, etc. The pagination mechanic
// is independent of the row contents.
message Record {
  uint64 id = 1;
  string created_at = 2;  // ISO 8601 timestamp
  string label = 3;
}

service ListService {
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse);
}
